<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eng Buddy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Mali:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE everyday learning: friendly, soft, encouraging
   IDEA a pastel sticker notebook with a little owl study buddy
   PICTURE Buddy the owl beside a big progress ring of words remembered out of 3000
   COLOUR warm milk ground, mint leads, peach supports, berry accent; lavender for grammar
   TYPE Fredoka for headings + Nunito/Mali for text (Mali covers Thai)
   LAYOUT side rail + content on laptop; top bar + bottom tabs on phone */
:root{color-scheme:light dark;
--bg:light-dark(#fff8f1,#1b1824);--card:light-dark(#ffffff,#262232);--ink:light-dark(#2b2540,#f4efff);--soft:light-dark(#6f6685,#b7adcc);
--line:light-dark(#f1e5d8,#383148);--mint:light-dark(#1fae84,#4fd6ac);--mintbg:light-dark(#dcf5ea,#173a31);--peach:light-dark(#ff9f73,#ffb08b);--peachbg:light-dark(#ffe9dc,#3b2b24);
--berry:light-dark(#f0457a,#ff7aa3);--berrybg:light-dark(#ffe3ec,#3d2030);--lav:light-dark(#7d6cf0,#a597ff);--lavbg:light-dark(#ece8ff,#2b2547);--sky:light-dark(#3aa3e8,#7cc4f5);--skybg:light-dark(#e1f1fd,#1a3042);
--shadow:0 2px 0 light-dark(#f0e2d3,#14111b)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Nunito,Mali,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Fredoka,Mali,sans-serif;line-height:1.1;letter-spacing:-.01em;margin:0}
h1{font-size:clamp(30px,4.4vw,44px)}h2{font-size:clamp(22px,3vw,28px)}h3{font-size:19px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:2px solid var(--line);display:flex;flex-direction:column;gap:6px;background:var(--card)}
.brand{display:flex;align-items:center;gap:10px;font:700 22px Fredoka,sans-serif;padding:0 8px 16px}
.brand svg{width:40px;height:40px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:16px;color:var(--ink);text-decoration:none;font-weight:700;min-height:46px}
.nav a:hover{background:var(--mintbg)}
.nav a.on{background:var(--mint);color:#fff}
.nav i{font-style:normal;width:26px;height:26px;display:grid;place-items:center;border-radius:9px;background:var(--line);font:700 13px Fredoka}
.nav a.on i{background:rgba(255,255,255,.25)}
.railfoot{margin-top:auto;font-size:14px;padding:8px 4px}
.who{display:flex;align-items:center;gap:10px}
.av{width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font:700 17px Fredoka;flex:none}
.av.big2{width:64px;height:64px;font-size:28px}
.login{max-width:720px;margin:20px auto;padding:clamp(20px,4vw,36px)}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:16px}
.pcard{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px solid var(--line);background:var(--card);border-radius:22px;padding:16px 10px;box-shadow:var(--shadow)}
.pcard:hover,.pcard.on{border-color:var(--mint)}
.grow{flex:1}
main{padding:clamp(18px,3vw,40px) max(3vw,16px) 110px;max-width:1180px;width:100%}
.top{display:none}
.tabs{display:none}
.card{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--shadow)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.auto{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.muted{color:var(--soft)}.small{font-size:14px}
.btn{border:0;border-radius:16px;padding:11px 18px;min-height:46px;font-weight:800;background:var(--mint);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--mint) 60%,#000);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--mint) 60%,#000)}
.btn.peach{background:var(--peach);box-shadow:0 3px 0 color-mix(in srgb,var(--peach) 65%,#000)}
.btn.lav{background:var(--lav);box-shadow:0 3px 0 color-mix(in srgb,var(--lav) 65%,#000)}
.btn.berry{background:var(--berry);box-shadow:0 3px 0 color-mix(in srgb,var(--berry) 65%,#000)}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:var(--shadow)}
.btn:disabled{opacity:.5;cursor:default}
.icon{width:46px;height:46px;border-radius:14px;border:2px solid var(--line);background:var(--card);display:inline-grid;place-items:center;font-size:20px;padding:0}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-weight:800;font-size:13px;background:var(--line)}
.lvA1{background:var(--mintbg);color:var(--mint)}.lvA2{background:var(--skybg);color:var(--sky)}.lvB1{background:var(--peachbg);color:color-mix(in srgb,var(--peach) 70%,var(--ink))}.lvB2{background:var(--lavbg);color:var(--lav)}.lvC1{background:var(--berrybg);color:var(--berry)}
.asS{--a:#f5b70a;--abg:light-dark(#fff4cc,#3a3115)}.asC{--a:#ff8a4c;--abg:light-dark(#ffe6d8,#3b2619)}.asP{--a:#7d6cf0;--abg:light-dark(#ece8ff,#2b2547)}.asPC{--a:#e0559a;--abg:light-dark(#ffe1ef,#3d2030)}
.tmPresent{--t:#1fae84}.tmPast{--t:#e0455f}.tmFuture{--t:#3a8ee8}
.tt{display:grid;grid-template-columns:150px repeat(3,minmax(0,1fr));gap:10px;align-items:stretch}
.tt .th0{font:700 17px Fredoka;color:#fff;border-radius:16px;padding:10px 14px;background:var(--t);display:flex;align-items:center;justify-content:center;gap:6px}
.tt .ah{border-radius:16px;padding:10px 12px;background:var(--abg);border-left:6px solid var(--a);font-weight:800;font-size:14px;display:flex;flex-direction:column;justify-content:center}
.tt .ah b{font:700 16px Fredoka;color:color-mix(in srgb,var(--a) 75%,var(--ink))}
.tcell{display:block;width:100%;text-align:left;border:2px solid transparent;background:var(--abg);border-radius:18px;padding:12px 14px;border-top:6px solid var(--t);box-shadow:var(--shadow)}
.tcell:hover{border-color:var(--a)}
.tcell b{font:700 16px Fredoka;display:block}
.tcell .done{float:right;font-size:12px;font-weight:800;color:var(--mint)}
.fx{font-family:Fredoka,Mali,sans-serif;font-weight:600}
.k-will{color:#3a8ee8}.k-be{color:#ff7a33}.k-have{color:#7d6cf0}.k-been{color:#e0559a}.k-do{color:#e0455f}.k-ing{color:#ff7a33;text-decoration:underline 3px}.k-v{color:#1fae84;text-decoration:underline 3px}.k-not{color:var(--soft)}
.k-will,.k-be,.k-have,.k-been,.k-do,.k-v,.k-ing{font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:14px;font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.syn{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:6px}
.syn span{background:var(--card);border-radius:999px;padding:3px 10px;font-weight:700;font-size:14px}
.lines .ln{display:flex;gap:10px;padding:8px 0;border-bottom:2px dashed var(--line)}
.lines .who{font:700 14px Fredoka;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff}
.timer{font:700 20px Fredoka;font-variant-numeric:tabular-nums;white-space:nowrap}
.big{font:700 clamp(56px,10vw,88px)/1 Fredoka}
.cert{background:linear-gradient(160deg,var(--mintbg),var(--lavbg));border-radius:32px;padding:clamp(20px,3vw,34px)}
.skill{background:var(--card);border-radius:20px;padding:16px}
.pw{display:flex;gap:8px}
@media(max-width:700px){.tt{grid-template-columns:minmax(0,1fr)}.tt .hdr,.tt .ah{display:none}.tcell{border-left:6px solid var(--a)}}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:8px 14px;font-weight:800;min-height:44px}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=text],input[type=search],textarea,select{width:100%;border:2px solid var(--line);background:var(--card);border-radius:16px;padding:12px 14px;font-size:16px}
textarea{min-height:180px;resize:vertical;line-height:1.6}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden}.bar>b{display:block;height:100%;background:var(--mint);border-radius:99px}
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:stretch;background:var(--mintbg);border-radius:32px;padding:clamp(20px,3vw,34px);margin-bottom:18px}
.ringwrap{display:flex;align-items:center;justify-content:center;gap:10px;position:relative}
.ring{width:min(210px,44vw);aspect-ratio:1;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .lbl b{font:700 clamp(34px,6vw,50px)/1 Fredoka}
.owl{width:min(170px,34vw)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:18px}
.stat{background:var(--card);border-radius:20px;padding:12px 14px}
.stat b{display:block;font:700 26px/1.1 Fredoka}
.stat span{font-size:13px;color:var(--soft)}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:24px;padding:18px;box-shadow:var(--shadow);color:var(--ink);text-decoration:none;min-height:120px}
.tile:hover{border-color:var(--mint)}
.tile .t{font:700 19px Fredoka}
.tile .sw{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font:700 16px Fredoka}
.sec{margin:26px 0 12px;display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.flash{perspective:1200px;max-width:520px;margin:0 auto}
.flash .inner{position:relative;min-height:380px;transition:transform .45s;transform-style:preserve-3d;cursor:pointer}
.flash.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:32px;border:2px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;box-shadow:0 6px 0 var(--line)}
.face.back{transform:rotateY(180deg);background:var(--peachbg)}
.pic{width:150px;height:150px;border-radius:32px;background:var(--mintbg);display:grid;place-items:center;font-size:92px;line-height:1;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:contain}
.prev{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;width:100%;margin:4px 0}
.prev>div{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.prev span{font-weight:800;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pic.xs{width:100%;max-width:58px;height:auto;aspect-ratio:1;border-radius:14px;font-size:30px}
.pic.xs .gen{font-size:11px;padding:2px}
.pic.sm{width:54px;height:54px;border-radius:16px;font-size:32px}
.pic.md{width:110px;height:110px;border-radius:26px;font-size:66px}
.pic .gen{font-size:13px;color:var(--soft);padding:8px;text-align:center}
.word{font:700 clamp(34px,6vw,46px)/1.1 Fredoka}
.th{font:600 clamp(22px,4vw,28px)/1.4 Mali,sans-serif}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:18px;padding:14px;min-height:58px;font-weight:700;font-size:17px;text-align:center;box-shadow:var(--shadow)}
.opt:hover{border-color:var(--lav)}
.opt.ok{background:var(--mintbg);border-color:var(--mint)}.opt.no{background:var(--berrybg);border-color:var(--berry)}
.qbox{max-width:620px;margin:0 auto}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.formula{display:grid;gap:10px}
.formula div{border-radius:18px;padding:12px 16px;font-weight:800;font-family:Fredoka,Mali,sans-serif;font-size:18px}
.f1{background:var(--mintbg)}.f2{background:var(--berrybg)}.f3{background:var(--lavbg)}
.formula small{display:block;font:700 13px Nunito,Mali;color:var(--soft)}
.tgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tcol h3{margin-bottom:8px}
.tcard{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:20px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow)}
.tcard:hover{border-color:var(--lav)}
.tcard b{font:700 17px Fredoka;display:block}
.tcard .done{float:right;color:var(--mint);font-weight:800}
.ex{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:2px dashed var(--line)}
.ex:last-child{border-bottom:0}
.ex .en{font-weight:800}
.passage{font-size:18px;line-height:1.9}
.passage span.w{cursor:pointer;border-radius:6px}
.passage span.w:hover{background:var(--peachbg)}
.pop{position:fixed;z-index:20;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:18px;padding:12px 18px;font-weight:700;max-width:min(92vw,420px);display:none;align-items:center;gap:12px}
.pop.on{display:flex}
.ai{background:var(--lavbg);border:2px solid color-mix(in srgb,var(--lav) 35%,var(--line));border-radius:24px;padding:18px}
.ai h3{color:var(--lav)}
.fix{border-left:4px solid var(--berry);padding:6px 12px;margin:10px 0;background:var(--card);border-radius:0 14px 14px 0}
.fix del{color:var(--berry)}.fix ins{color:var(--mint);text-decoration:none;font-weight:800}
.score{font:700 54px/1 Fredoka;color:var(--lav)}
.mic{width:84px;height:84px;border-radius:50%;border:0;background:var(--berry);color:#fff;font:700 15px Fredoka;box-shadow:0 4px 0 color-mix(in srgb,var(--berry) 60%,#000)}
.mic.live{animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px color-mix(in srgb,var(--berry) 25%,transparent)}}
.tw span{padding:2px 4px;border-radius:6px;margin:0 1px;display:inline-block}
.tw .hit{background:var(--mintbg);color:var(--mint)}.tw .miss{background:var(--berrybg);color:var(--berry)}
.list{display:grid;gap:8px}
.li{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 12px}
.li .grow{flex:1}
.notice{background:var(--peachbg);border-radius:18px;padding:12px 16px;font-size:15px}
.spin{display:inline-block;width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--lav);border-radius:50%;animation:sp 1s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.tgrid{grid-template-columns:minmax(0,1fr)}}
@media(max-width:760px){
.app{grid-template-columns:minmax(0,1fr)}
.rail{display:none}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px;font:700 20px Fredoka;position:sticky;top:0;background:var(--bg);z-index:5}
.top svg{width:34px;height:34px}
.tabs{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:2px solid var(--line);z-index:10;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs a{flex:1 0 64px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:14px;text-decoration:none;color:var(--soft);font-size:12px;font-weight:800;min-height:52px}
.tabs a i{font-style:normal;font:700 15px Fredoka}
.tabs a.on{color:var(--mint);background:var(--mintbg)}
main{padding-top:6px}
}
@media(max-width:600px){
.hero{grid-template-columns:minmax(0,1fr)}
.g3,.g2{grid-template-columns:minmax(0,1fr)}
.stats{grid-template-columns:repeat(3,minmax(0,1fr))}
.opts{grid-template-columns:minmax(0,1fr)}
.flash .inner{min-height:340px}
}
</style>
</head>

<script>
{
const NAV=[["home","H","หน้าแรก"],["vocab","V","คำศัพท์"],["grammar","G","12 Tenses"],["phrases","P","ประโยคใช้บ่อย"],["reading","R","Reading"],["writing","W","Writing"],["speaking","S","Speaking"],["listening","L","Listening"],["test","T","สอบวัดระดับ"],["settings","AI","ตั้งค่า AI"]];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n)=>shuffle(a).slice(0,n);
const store={get(k,d){try{const v=localStorage.getItem('eb.'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('eb.'+k,JSON.stringify(v))}catch(e){}}};
const day=(o=0)=>{const d=new Date(Date.now()+o*864e5);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const DEF=()=>({srs:{},streak:{last:'',n:0},today:{d:'',n:0,xp:0},done:{},goal:10});
let S=DEF();
function save(){if(!PID)return;store.set(pk('state'),S);if(CLOUD)cloudSave()}
let VOCAB=[],BYW=new Map(),LV={A1:[],A2:[],B1:[],B2:[],C1:[]},AI=null,DICT=null,TTS=null;
const view=$('#view');

/* ---------- progress ---------- */
function rollDay(){const t=day();if(S.today.d!==t)S.today={d:t,n:0,xp:0}}
function touchDay(){rollDay();const t=day();if(S.streak.last!==t){S.streak.n=S.streak.last===day(-1)?S.streak.n+1:1;S.streak.last=t}}
function bump(xp){touchDay();S.today.xp+=xp;save()}
const INT=[0,1,2,4,7,15,30,60];
function grade(w,ok){touchDay();let r=S.srs[w];if(!r){r={b:0,d:0};S.today.n++}r.b=ok?Math.min(r.b+1,7):1;r.d=Date.now()+(ok?INT[r.b]*864e5:6e5);S.srs[w]=r;S.today.xp+=ok?2:1;save()}
const learned=()=>Object.keys(S.srs).length;
const mastered=()=>Object.values(S.srs).filter(r=>r.b>=4).length;
const dueList=()=>Object.entries(S.srs).filter(([w,r])=>r.d<=Date.now()&&BYW.has(w)).sort((a,b)=>a[1].d-b[1].d).map(([w])=>BYW.get(w));

/* ---------- speech out ---------- */
let enVoice=null;
function loadVoices(){try{const v=speechSynthesis.getVoices();enVoice=v.find(x=>/en[-_]US/i.test(x.lang)&&/natural|google|samantha|aria|jenny/i.test(x.name))||v.find(x=>/^en/i.test(x.lang))||null}catch(e){}}
try{loadVoices();speechSynthesis.onvoiceschanged=loadVoices}catch(e){}
function webSpeak(t,rate=.92){try{if(!enVoice)return false;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.voice=enVoice;u.lang=enVoice.lang;u.rate=rate;speechSynthesis.speak(u);return true}catch(e){return false}}
function speak(t,{slow=false,word=false}={}){
 if(word&&webSpeak(t,slow?.7:.9))return;
 if(TTS){TTS.speak(t,{language:'en',rate:slow?.75:.95}).catch(()=>webSpeak(t,slow?.7:.92));return}
 if(!webSpeak(t,slow?.7:.92))toast('เครื่องนี้ยังไม่มีเสียงอ่านภาษาอังกฤษ');
}

/* ---------- AI ---------- */
function aiErr(e){const c=e&&e.code;return c==='rate_limited'?'AI ถูกใช้งานถี่เกินไป รอสักครู่แล้วลองใหม่':c==='not_granted'?'ยังไม่ได้อนุญาตให้หน้านี้ใช้ AI':c==='no_ai'?'ยังไม่มี AI ให้ใช้ ไปที่หน้า “ตั้งค่า AI” เพื่อเลือกผู้ให้บริการ':c==='api'?'API ตอบกลับผิดพลาด: '+String(e.message||'').slice(0,160):'AI ตอบกลับไม่สำเร็จ ลองใหม่อีกครั้ง'}
const PROV={builtin:{n:'Claude ในแอปนี้ (ไม่ต้องใช้คีย์)'},openai:{n:'OpenAI (ChatGPT)',m:'gpt-4o-mini'},anthropic:{n:'Anthropic (Claude API)',m:'claude-haiku-5-5'},gemini:{n:'Google Gemini',m:'gemini-2.5-flash'},openrouter:{n:'OpenRouter (รวมหลายโมเดล)',m:'openai/gpt-4o-mini'},custom:{n:'OpenAI-compatible อื่นๆ (Groq, Together, Ollama ฯลฯ)',m:''}};
const SANDBOX=!!(window.claude&&window.claude.use);
let CFG={provider:'builtin',key:'',model:'',base:''};
const extOn=()=>CFG.provider!=='builtin'&&(CFG.key||CFG.provider==='custom')&&!SANDBOX;
const aiReady=()=>extOn()||!!AI;
async function callProvider(c,prompt){
 const p=c.provider,model=c.model||PROV[p].m;let r,j;
 if(p==='anthropic'){r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':c.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model,max_tokens:4000,messages:[{role:'user',content:prompt}]})});j=await r.json();if(!r.ok)throw{code:'api',message:(j.error&&j.error.message)||r.status};return (j.content||[]).map(x=>x.text||'').join('')}
 if(p==='gemini'){r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent?key='+encodeURIComponent(c.key),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})});j=await r.json();if(!r.ok)throw{code:'api',message:(j.error&&j.error.message)||r.status};return ((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(x=>x.text||'').join('')}
 const base=(p==='openai'?'https://api.openai.com/v1':p==='openrouter'?'https://openrouter.ai/api/v1':(c.base||'')).replace(/\/+$/,'');
 if(!base)throw{code:'api',message:'ยังไม่ได้ใส่ Base URL'};
 const hd={'content-type':'application/json'};if(c.key)hd.authorization='Bearer '+c.key;
 r=await fetch(base+'/chat/completions',{method:'POST',headers:hd,body:JSON.stringify({model,messages:[{role:'user',content:prompt}]})});j=await r.json();if(!r.ok)throw{code:'api',message:(j.error&&(j.error.message||j.error))||r.status};return (j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||''
}
async function ask(prompt,tier='default'){
 if(extOn()){try{return await callProvider(CFG,prompt)}catch(e){if(e&&e.code)throw e;throw{code:'api',message:String(e&&e.message||e)}}}
 if(!AI)throw{code:'no_ai'};const r=await AI(prompt,{modelTier:tier});return r.text||''}
async function askJSON(prompt,tier='default'){const t=await ask(prompt+'\n\nReply with ONLY one valid JSON object. No markdown, no code fences.',tier);const m=t.match(/\{[\s\S]*\}/);return JSON.parse(m?m[0]:t)}
const aiNote=()=>aiReady()?'':'<div class="notice small" style="margin-top:10px">ยังไม่มี AI สำหรับตรวจ: เปิดหน้านี้ใน Claude แล้วกดอนุญาต หรือใส่ API key ของคุณเองในหน้า <a href="#settings">ตั้งค่า AI</a> ส่วนบทเรียนและแบบฝึกหัดอื่นใช้ได้เลย</div>';

let imgQ=[],imgBusy=false;
const imgKey=w=>'img.'+w;
function picHTML(v,cls=''){
 const [w,,,emo]=v;
 if(emo)return `<div class="pic ${cls}" aria-hidden="true">${esc(emo)}</div>`;

 if(svg)return `<div class="pic ${cls}"><img alt="" src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}"></div>`;
 return `<div class="pic ${cls}" data-pic="${esc(w)}"><div class="gen">${aiReady()?'<span class="spin"></span>':'🖼️'}</div></div>`;
}
function queuePics(){if(!aiReady())return;document.querySelectorAll('[data-pic]').forEach(el=>{const w=el.dataset.pic;if(!imgQ.includes(w))imgQ.push(w)});runPics()}
async function runPics(){
 if(imgBusy||!imgQ.length)return;imgBusy=true;const w=imgQ.shift();const v=BYW.get(w);
 try{
  const t=await ask(`Draw a cute, simple, flat pastel illustration that clearly represents the English word "${w}" (Thai meaning: ${v?v[2]:''}). Rules: output ONLY one <svg> element with viewBox="0 0 120 120", rounded friendly shapes, 3-6 soft colours, no text or letters, no <script>, no external links, no <image>, under 2500 characters.`,'quick');
  const m=t.match(/<svg[\s\S]*<\/svg>/i);
  if(m&&!/<script|\son\w+=|<image|<foreignObject|href\s*=\s*["']?(?!#)/i.test(m[0])){store.set(imgKey(w),m[0]);document.querySelectorAll(`[data-pic="${CSS.escape(w)}"]`).forEach(el=>{el.removeAttribute('data-pic');el.innerHTML=`<img alt="" src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(m[0])}">`})}

V.grammar=()=>{

/* ---------- mic ---------- */
let micOn=false,micTarget=null,REC=null;
const SR=!SANDBOX&&(window.SpeechRecognition||window.webkitSpeechRecognition);
const micAvail=()=>!!(DICT||SR);
function micBtn(box,after=''){return micAvail()?`<button class="mic" data-act="mic" data-box="${box}" data-after="${after}">พูด</button>`:`<div class="notice small">ใช้ไมโครโฟนได้เมื่อเปิดใน Claude บน Chrome/Edge หรือแอปเดสก์ท็อป หรือเปิดไฟล์ฉบับออฟไลน์ด้วย Chrome ตอนนี้พิมพ์สิ่งที่พูดแทนได้</div>`}
function setMic(on){micOn=on;document.querySelectorAll('[data-act=mic]').forEach(b=>{b.classList.toggle('live',on);b.textContent=on?'หยุด':'พูด'})}
function micDone(){const t=micTarget;if(t&&t.after==='ra'&&t.box.value.trim()&&$('#target'))raCheck()}
function micClick(b){
 if(micOn){if(DICT)DICT.stop().catch(()=>{});else if(REC)REC.stop();return}
 const box=$('#'+b.dataset.box);if(!box)return;
 const keep=box.tagName==='TEXTAREA'&&box.value.trim();micTarget={box,base:keep?box.value.trim()+' ':'',fin:'',after:b.dataset.after};if(!keep)box.value='';
 if(DICT){DICT.start().then(()=>setMic(true)).catch(e=>{setMic(false);toast(e&&e.code==='not_granted'?'ไม่ได้รับอนุญาตใช้ไมโครโฟน พิมพ์แทนได้':'เริ่มฟังไม่สำเร็จ ลองอีกครั้ง')});return}
 try{REC=new SR();REC.lang='en-US';REC.interimResults=true;REC.continuous=true;
  REC.onresult=e=>{let part='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)micTarget.fin+=t+' ';else part+=t}box.value=micTarget.base+micTarget.fin+part};
  REC.onend=()=>{setMic(false);micDone()};REC.onerror=e=>toast('ไมโครโฟน: '+esc(e.error));REC.start();setMic(true)}catch(e){toast('เริ่มไมโครโฟนไม่สำเร็จ')}
}

/* ---------- router ---------- */
function render(){
 updateWho();
 if(!PID){setNav('');if(FB){view.innerHTML=gLoginHTML();return}view.innerHTML=loginHTML();loginAfter();return}
 const h=(location.hash||'#home').slice(1),name=V[h]?h:'home';
 setNav(name==='dict'?'vocab':name);
 view.innerHTML=V[name]();
 after(name);
}
function after(name){
 queuePics();
 if(name==='dict'){const q=$('#q');q.addEventListener('input',()=>dictSearch(q.value));dictSearch('');q.focus()}
 if(name==='writing'){const t=$('#wtext'),c=()=>{$('#wcount').textContent=norm(t.value).length+' คำ';store.set(pk('wdraft'),t.value)};t.addEventListener('input',c);c();$('#wsel').addEventListener('change',e=>{ctx.wp=+e.target.value;$('#wtask').textContent=WPROMPTS[ctx.wp][1]})}
 if(name==='speaking'){const s=$('#ssel');if(s)s.addEventListener('change',e=>{ctx.sq=+e.target.value;render()})}
 if(name==='test')testAfter();
 const sp=$('#spf');if(sp){sp.addEventListener('submit',e=>{e.preventDefault();const q=ctx.qs[ctx.qi];if(q.done)return;q.done=1;const ok=$('#spin').value.trim().toLowerCase()===q.v[0];answer(ok,q.v)});$('#spin').focus()}
 const ef=$('#etf');if(ef){ef.addEventListener('submit',async e=>{e.preventDefault();const q=ctx.qs[ctx.qi];if(q.done)return;const ans=$('#etin').value.trim();if(!ans){toast('พิมพ์ความหมายภาษาไทยก่อนนะ');return}
  q.done=1;$('#etin').disabled=true;ef.querySelector('button').disabled=true;const v=q.v;
  const nz=s=>String(s).toLowerCase().replace(/\s+/g,'').replace(/[()（）"'.]/g,'');const parts=v[2].split(/[,/]/).map(nz).filter(Boolean);const a2=nz(ans);
  if(parts.some(p=>p===a2||(a2.length>=2&&p.includes(a2)&&a2.length>=p.length*.6)||(p.length>=2&&a2.includes(p)))){answer(true,v);return}
  if(!aiReady()){answer(false,v);$('#fb .notice').insertAdjacentHTML('beforeend',`<div class="small" style="margin-top:6px">ตอนนี้ยังไม่มี AI ช่วยตรวจ ถ้าคำตอบของคุณความหมายใกล้เคียงกับคำแปล กดนับว่าถูกได้ <button class="btn ghost" data-act="selfok" style="min-height:36px;padding:4px 12px">นับว่าถูก</button></div>`);return}
  $('#fb').innerHTML='<div class="notice"><span class="spin"></span> AI กำลังตรวจความหมาย…</div>';
  try{const r=await askJSON(`A Thai learner was asked what the English word "${v[0]}" means. Reference Thai meaning: "${v[2]}". The learner answered in Thai: "${ans}". Judge whether the answer gives a correct meaning of the English word. Accept synonyms, other valid senses of the word, informal Thai and small typos. Use "partly" when the answer is close but too broad, too narrow or the wrong part of speech. JSON: {"verdict":"correct|partly|wrong","explain_th":"1-2 short friendly sentences in Thai explaining why","meanings_th":["1-3 common Thai meanings"]}`,'quick');
   const vd=String(r.verdict||'').toLowerCase();answer(vd==='correct'||vd==='partly',v);
   $('#fb .notice').insertAdjacentHTML('beforeend',`<div class="small" style="margin-top:6px"><b>AI ${vd==='correct'?'ตัดสินว่าถูก':vd==='partly'?'ตัดสินว่าใกล้เคียง (นับว่าถูก)':'ตัดสินว่ายังไม่ถูก'}:</b> ${esc(r.explain_th||'')}${(r.meanings_th||[]).length?'<br>ความหมายที่ใช้บ่อย: '+r.meanings_th.map(esc).join(', '):''}</div>`)}
  catch(err){answer(false,v);$('#fb .notice').insertAdjacentHTML('beforeend',`<div class="small" style="margin-top:6px">${esc(aiErr(err))} <button class="btn ghost" data-act="selfok" style="min-height:36px;padding:4px 12px">นับว่าถูก</button></div>`)}
 });$('#etin').focus()}
 fitCols();
}
function testAfter(){const T=ctx.test;if(!T)return;fitCols();
 if((T.kind==='core'&&!T.done)||T.kind==='writing'||T.kind==='speaking')startTick();
 if(T.kind==='writing')TEST_WRITING.forEach((w,i)=>{const ta=$('#tw'+i);if(ta)ta.addEventListener('input',()=>{T.texts[i]=ta.value;$('#twc'+i).textContent=norm(ta.value).length+' คำ';store.set(pk('twdraft'),T.texts)})});}
function fitCols(){const narrow=innerWidth<700;['#rgrid','#wgrid','#sgrid'].forEach(s=>{const e=$(s);if(e)e.style.gridTemplateColumns=narrow?'minmax(0,1fr)':''})}
addEventListener('resize',fitCols);

Task 1 (${TEST_WRITING[0].task}): ${TEST_WRITING[0].prompt}
Answer 1: <<<${t0}>>>
Task 2 (${TEST_WRITING[1].task}): ${TEST_WRITING[1].prompt}
Answer 2: <<<${t1}>>>
JSON: {"score":0,"cefr":"Pre-A1|A1|A2|B1|B2|C1","criteria":{"task_achievement":0,"coherence":0,"vocabulary":0,"grammar":0},"feedback_th":"3-4 sentences in Thai explaining the level","improve_th":["3-4 concrete tips in Thai"]} (criteria are 0-10).`);
   const sc=Math.max(0,Math.min(599,Math.round(+r.score||0)));S.tests=S.tests||{};S.tests.writing={score:sc,cefr:band(sc),date:day(),crit:r.criteria,fb:r.feedback_th,imp:r.improve_th};S.hist=(S.hist||[]).concat([{k:'writing',score:sc,date:day()}]).slice(-30);bump(10);store.set(pk('twdraft'),['','']);
   clearInterval(TICK);ctx.test={kind:'result',which:'writing'};view.innerHTML=testHTML();scrollTo(0,0)}catch(err){st.textContent=aiErr(err)}return}
 if(a==='tsnext'||a==='tssubmit'){const T=ctx.test;if(micOn){if(DICT)DICT.stop().catch(()=>{});else if(REC)REC.stop()}T.ans[T.step]=$('#tsbox').value.trim();

  if(a==='tsnext'){T.step++;T.stepStart=Date.now();view.innerHTML=testHTML();return}
  const nR=TEST_SPEAKING.read.length;const acc=TEST_SPEAKING.read.map((s,i)=>cmpWords(s,T.ans[i]||'').pct);const st=$('#tsst');st.innerHTML='<span class="spin"></span> AI กำลังประเมิน…';

${TEST_SPEAKING.questions.map((q,i)=>`Question ${i+1}: ${q}\nAnswer ${i+1}: <<<${T.ans[nR+i]}>>>`).join('\n')}

   const sc=Math.max(0,Math.min(599,Math.round(+r.score||0)));S.tests=S.tests||{};S.tests.speaking={score:sc,cefr:band(sc),date:day(),crit:r.criteria,fb:r.feedback_th,imp:r.improve_th};S.hist=(S.hist||[]).concat([{k:'speaking',score:sc,date:day()}]).slice(-30);bump(10);
   clearInterval(TICK);ctx.test={kind:'result',which:'speaking'};view.innerHTML=testHTML();scrollTo(0,0)}catch(err){st.textContent=aiErr(err)}return}
 if(a==='prov'){CFG.provider=b.value;render();return}
 if(a==='keyshow'){const k=$('#ckey');k.type=k.type==='password'?'text':'password';return}
 if(a==='cfgsave'||a==='cfgtest'){if($('#ckey'))CFG.key=$('#ckey').value.trim();if($('#cmodel'))CFG.model=$('#cmodel').value.trim();if($('#cbase'))CFG.base=$('#cbase').value.trim();store.set(pk('ai'),CFG);

  o.innerHTML='<span class="spin"></span> กำลังทดสอบ…';try{const t=await ask('Reply with exactly: OK','quick');o.innerHTML='เชื่อมต่อสำเร็จ ✔ คำตอบ: '+esc(t.slice(0,40))}catch(err){o.textContent=aiErr(err)}return}
 if(a==='bkcopy'){const data=JSON.stringify({state:S});const tb=$('#bk');tb.value=data;tb.select();try{navigator.clipboard.writeText(data).then(()=>toast('คัดลอกแล้ว'),()=>toast('เลือกข้อความในช่องแล้วคัดลอกเองได้'))}catch(e){toast('เลือกข้อความในช่องแล้วคัดลอกเองได้')}return}
 if(a==='bkload'){try{const o=JSON.parse($('#bk').value);if(!o.state||!o.state.srs)throw 0;S=Object.assign(S,o.state);save();toast('นำเข้าความคืบหน้าแล้ว')}catch(e){toast('ข้อมูลสำรองไม่ถูกต้อง')}return}
 if(a==='lpick2'){const p=profiles().find(x=>x.id===d.id);if(!p)return;if(!p.pin){loginLocal(p.id);ctx={};render();return}ctx.lpick=p.id;render();return}
 if(a==='logout'){logout();return}
 if(a==='glogin'){gLogin();return}
 if(a==='pdel'){if(!b.dataset.sure){b.dataset.sure=1;b.textContent='กดอีกครั้งเพื่อยืนยันการลบ';return}const id=PID;store.set('profiles',profiles().filter(p=>p.id!==id));try{Object.keys(localStorage).filter(k=>k.startsWith('eb.p.'+id+'.')).forEach(k=>localStorage.removeItem(k))}catch(e){}PID=null;ME=null;store.set('active',null);S=DEF();ctx={};render();return}
 if(a==='pcat'){ctx.pc=+d.i;render();return}
 if(a==='pquiz'){const cat=PHRASES[ctx.pc||0],all=PHRASES.flatMap(p=>p.items);ctx.pq={i:0,right:0,picked:null,qs:shuffle(cat.items).map(p=>({p,opts:shuffle([p,...pick(all.filter(x=>x!==p),3)])}))};render();return}
 if(a==='pans'){const z=ctx.pq;if(z.picked!==null)return;z.picked=+d.i;const q=z.qs[z.i];if(q.opts[z.picked]===q.p)z.right++;speak(q.p[0]);view.innerHTML=phraseQuizHTML();return}
 if(a==='pnext'){const z=ctx.pq;z.i++;z.picked=null;view.innerHTML=phraseQuizHTML();return}
 if(a==='pexit'){ctx.pq=null;render();return}
 if(a==='rpick'){ctx.rd=READINGS[+d.i];ctx.rq=null;render();scrollTo(0,0);return}
 if(a==='rexit'){ctx.rd=null;render();return}
 if(a==='rans'){const z=ctx.rq;if(z.ans[d.q]!==undefined)return;z.ans[d.q]=+d.i;if(Object.keys(z.ans).length===ctx.rd.qs.length)bump(5);const y=scrollY;render();scrollTo(0,y);return}
 if(a==='look'){const raw=d.w.toLowerCase();const cands=[raw,raw.replace(/'s$/,''),raw.replace(/s$/,''),raw.replace(/es$/,''),raw.replace(/ed$/,''),raw.replace(/d$/,''),raw.replace(/ing$/,''),raw.replace(/ing$/,'e'),raw.replace(/ies$/,'y'),raw.replace(/ied$/,'y')];const v=cands.map(c=>BYW.get(c)).find(Boolean);
  speak(raw,{word:true});toast(v?`<b>${esc(v[0])}</b> ${esc(v[2])} ${lvChip(v[1])}`:`<b>${esc(raw)}</b> ไม่อยู่ในคลังคำศัพท์`);return}
 if(a==='rgen'){const st=$('#rst');st.innerHTML=' <span class="spin"></span> กำลังเขียนบทความ…';const lv=$('#rlv').value,tp=$('#rtp').value;
  try{const r=await askJSON(`Write an original English reading passage for a Thai learner at CEFR ${lv} level about the topic "${tp}" (Thai topic name). Length: ${lv==='A2'?'110-140':lv==='B1'?'160-200':'200-250'} words, natural and interesting. Then write 4 multiple-choice comprehension questions with 4 options each, and pick 5 useful words from the text with Thai meanings. JSON: {"title":"...","text":"...","questions":[{"q":"...","options":["","","",""],"answer":0}],"glossary":[{"word":"...","th":"..."}]}`);
   ctx.rd={level:lv,title:r.title,text:r.text,qs:(r.questions||[]).map(q=>[q.q,q.options,q.answer]),glossary:r.glossary||[]};ctx.rq=null;render();scrollTo(0,0)}catch(err){st.textContent=' '+aiErr(err)}return}
 if(a==='wcheck'){const txt=$('#wtext').value.trim(),out=$('#wout');if(norm(txt).length<15){toast('เขียนอย่างน้อย 15 คำก่อนนะ');return}
  out.innerHTML='<h3>ผลการตรวจ</h3><p><span class="spin"></span> AI กำลังอ่านงานเขียนของคุณ…</p>';
  try{const r=await askJSON(`You are an encouraging English writing examiner for Thai learners aiming for CEFR B2. Task: "${WPROMPTS[ctx.wp??2][1]}". Student text: """${txt}""". Evaluate task achievement, grammar, vocabulary and organisation. JSON: {"score":0-100,"cefr":"A1|A2|B1|B2|C1","summary_th":"2 sentences in Thai","strengths_th":["..."],"corrections":[{"original":"exact phrase from text","corrected":"...","explain_th":"short Thai"}],"improved":"a better version of the whole text keeping the student's ideas, at about one CEFR level higher","vocab_tips":[{"word":"useful B1-B2 word","th":"Thai meaning"}]}. Up to 6 corrections, 3-5 vocab tips.`);out.innerHTML=wResult(r);bump(8)}catch(err){out.innerHTML='<h3>ผลการตรวจ</h3><p>'+esc(aiErr(err))+'</p>'}return}
 if(a==='smode'){ctx.sm=d.m;if(micOn)DICT.stop().catch(()=>{});render();return}
 if(a==='ranext'){ctx.ra=pick(RA,1)[0];render();return}
 if(a==='racheck'){if(!$('#heard').value.trim()){toast('กดพูด หรือพิมพ์สิ่งที่พูดก่อน');return}raCheck();return}
 if(a==='scheck'){const txt=$('#said').value.trim(),out=$('#sout');if(norm(txt).length<8){toast('พูดหรือพิมพ์อย่างน้อย 2–3 ประโยคก่อนนะ');return}
  out.innerHTML='<h3>ผลการประเมิน</h3><p><span class="spin"></span> AI กำลังฟังคำตอบของคุณ…</p>';
  try{const r=await askJSON(`You are a friendly IELTS-style speaking coach for Thai learners. Question: "${SQ[ctx.sq][1]}". The student's spoken answer (speech-to-text transcript, so ignore punctuation and small recognition errors): """${txt}""". JSON: {"cefr":"A1|A2|B1|B2|C1","scores":{"fluency":0-10,"grammar":0-10,"vocabulary":0-10,"relevance":0-10},"feedback_th":"3 sentences in Thai: what was good and what to improve","corrections":[{"original":"...","corrected":"...","explain_th":"..."}],"better_answer":"a natural model answer at about B2, 4-6 sentences, keeping the student's ideas","useful_phrases":["..."]}`);
   out.innerHTML=`<h3>ผลการประเมิน</h3><span class="chip" style="background:var(--card)">ระดับ ${esc(r.cefr)}</span><div class="grid g2" style="margin:10px 0">${Object.entries(r.scores||{}).map(([k,v])=>`<div><div class="small">${({fluency:'ความคล่อง',grammar:'ไวยากรณ์',vocabulary:'คำศัพท์',relevance:'ตรงคำถาม'})[k]||esc(k)} <b>${esc(v)}/10</b></div><div class="bar"><b style="width:${(+v||0)*10}%;background:var(--lav)"></b></div></div>`).join('')}</div><p class="small">${esc(r.feedback_th)}</p>${(r.corrections||[]).map(c=>`<div class="fix"><del>${esc(c.original)}</del> → <ins>${esc(c.corrected)}</ins><div class="small muted">${esc(c.explain_th)}</div></div>`).join('')}${r.better_answer?`<div class="row" style="justify-content:space-between;margin-top:10px"><b>ตัวอย่างคำตอบ</b>${spk(r.better_answer)}</div><p style="background:var(--card);border-radius:14px;padding:12px">${esc(r.better_answer)}</p>`:''}${(r.useful_phrases||[]).length?`<p class="small"><b>วลีน่าใช้:</b> ${r.useful_phrases.map(esc).join(' · ')}</p>`:''}`;bump(8)}catch(err){out.innerHTML='<h3>ผลการประเมิน</h3><p>'+esc(aiErr(err))+'</p>'}return}
});
document.addEventListener('keydown',e=>{
 if(e.target.matches('input,textarea,select'))return;
 if(ctx.set&&ctx.mode==='card'&&$('#flash')){if(e.key===' '){e.preventDefault();$('[data-act=flip]').click()}if(e.key==='ArrowRight')$('[data-act=know][data-ok="1"]').click();if(e.key==='ArrowLeft')$('[data-act=know][data-ok="0"]').click()}
});

/* ---------- boot ---------- */
view.innerHTML='<p class="muted"><span class="spin"></span> กำลังโหลดคำศัพท์…</p>';setNav('home');
(window.VOCAB_DATA?Promise.resolve(window.VOCAB_DATA):fetch('vocab.json').then(r=>r.json())).then(a=>{VOCAB=a;a.forEach(v=>{BYW.set(v[0],v);LV[v[1]].push(v)});view.innerHTML='<p class="muted"><span class="spin"></span> กำลังเข้าสู่ระบบ…</p>';return initAuth().then(render)}).catch(()=>{view.innerHTML='<div class="notice">โหลดคลังคำศัพท์ไม่สำเร็จ ลองรีเฟรชหน้าอีกครั้ง</div>'});
const cl=window.claude;
if(cl&&cl.use){
 cl.use('sample').then(s=>{AI=s;if(VOCAB.length&&PID&&!ctx.test)render()}).catch(()=>{});
 cl.use('tts').then(t=>{TTS=t}).catch(()=>{});
 cl.use('dictation').then(dc=>{if(!dc)return;DICT=dc;
  dc.onPartial(({text})=>{if(micTarget)micTarget.box.value=micTarget.base+micTarget.fin+text});
  dc.onFinal(({text})=>{if(micTarget){micTarget.fin+=text+' ';micTarget.box.value=micTarget.base+micTarget.fin}});
  dc.onState(({state})=>{if(state==='listening')setMic(true);else if(micOn){setMic(false);micDone()}});
  if(VOCAB.length&&PID&&/speaking|test/.test(location.hash)&&!ctx.test)render()}).catch(()=>{});
}
